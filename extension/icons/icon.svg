<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="BetterMedium">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="128" height="128" rx="28" fill="#0f172a"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#glowGrad)" stroke-width="1.5"/>

  <!-- Document / Article Shape -->
  <rect x="24" y="22" width="80" height="84" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  
  <!-- Article Text Line Accents -->
  <line x1="36" y1="36" x2="68" y2="36" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="46" x2="92" y2="46" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylized 'M' Logo with Open Access Check Badge -->
  <!-- Left Pillar -->
  <path d="M36 58 V92" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round"/>
  <!-- Middle V -->
  <path d="M36 58 L64 82 L92 58" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Pillar -->
  <path d="M92 58 V92" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Emerald Open-Access Badge (Bottom Right Glow) -->
  <circle cx="94" cy="94" r="16" fill="#0f172a"/>
  <circle cx="94" cy="94" r="13" fill="url(#emeraldGrad)"/>
  <!-- Checkmark inside Badge -->
  <path d="M88 94 L92 98 L100 90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
