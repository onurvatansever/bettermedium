<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BetterMedium</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <img src="../icons/icon.svg" width="34" height="34" alt="">
          <div>
            <h1>BetterMedium</h1>
            <p>Ücretsiz okuyabileceklerini bul.</p>
          </div>
        </div>
      </header>

      <section id="permission-panel" class="permission-panel" hidden>
        <strong>Yayın domainleri için izin gerekiyor</strong>
        <p id="permission-message">
          Medium yazıları bağımsız yayın domainlerine yönlenebilir.
        </p>
        <button id="permission-button" class="primary-button" type="button">
          Bu yayınlara izin ver ve tekrar tara
        </button>
      </section>

      <section id="status-panel" class="status-panel" aria-live="polite">
        <div class="status-row">
          <span id="status-text">Açık e-posta okunuyor…</span>
          <span id="progress-text"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>

      <section id="summary" class="summary" hidden></section>
      <section id="results" class="results" aria-label="Ücretsiz yazılar"></section>

      <section id="empty-state" class="empty-state" hidden>
        <strong id="empty-title"></strong>
        <p id="empty-message"></p>
      </section>

      <footer class="footer">
        <button id="retry-button" class="secondary-button" type="button" hidden>
          Tekrar tara
        </button>
        <span>Veriler yalnızca bu tarayıcı oturumunda tutulur.</span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
